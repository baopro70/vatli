<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trạng thái của vật chất</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="browser-bar" aria-label="Thanh mô phỏng">
      <div class="browser-dots"><i></i><i></i><i></i></div>
      <div class="browser-tab active">Trạng thái của vật chất</div>
      <div class="browser-address">phet.colorado.edu/sims/html/states-of-matter</div>
    </header>

    <section class="simulation">
      <div class="temperature-control">
        <output id="temperature">14 K</output>
        <div class="thermometer"><span id="thermometer-fill"></span><b></b></div>
      </div>

      <section class="chamber" aria-label="Bình mô phỏng">
        <div class="glass"><canvas id="particles" width="360" height="390"></canvas></div>
      </section>

      <aside class="legend">
        <h1>Nguyên tử và Phân tử</h1>
        <button class="material selected" data-material="neon"><span>Neon</span><i class="neon"></i></button>
        <button class="material" data-material="argon"><span>Argon</span><i class="argon"></i></button>
        <button class="material" data-material="oxygen"><span>Oxygen</span><i class="oxygen"></i></button>
        <button class="material" data-material="water"><span>Nước</span><i class="water"></i></button>
        <div class="state-buttons">
          <button class="state active" data-state="solid"><span>▣</span>Rắn</button>
          <button class="state" data-state="liquid"><span>◉</span>Lỏng</button>
          <button class="state" data-state="gas"><span>☁</span>Hơi</button>
        </div>
      </aside>

      <div class="transport">
        <button id="pause" class="round pause" aria-label="Tạm dừng">Ⅱ</button>
        <button id="play" class="round" aria-label="Phát">▶</button>
      </div>
      <button id="reset" class="reset" aria-label="Đặt lại">↻</button>

      <footer class="sim-footer">
        <strong>Trạng thái của vật chất</strong>
        <nav><a class="current">◈ Trạng thái</a><a>♢ Chuyển phase</a><a>● Tương tác</a></nav>
      </footer>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
