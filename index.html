<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng Khí Lý Tưởng</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; }
        body {
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin: 0 0 10px 0; font-size: 1.5em; color: #4dabf7; text-align: center; }
        .sim-container {
            display: flex;
            gap: 15px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        canvas { background: #000000; border-radius: 8px; }
        .panel {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .box {
            background: #2a2a2a;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .box-title {
            font-weight: bold;
            font-size: 0.85em;
            color: #ffd43b;
            margin-bottom: 6px;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
            text-transform: uppercase;
        }
        .radio-group { display: flex; flex-direction: column; gap: 6px; font-size: 0.85em; }
        .radio-group label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        
        .control-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 8px;
            font-size: 0.85em;
        }
        input[type="range"].h-slider { width: 100%; cursor: pointer; }

        .heater-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a1a;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .slider-axis { display: flex; flex-direction: column; align-items: center; height: 80px; }
        input[type="range"].v-slider {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            width: 14px; height: 70px; cursor: pointer;
        }
        .labels { display: flex; flex-direction: column; justify-content: space-between; height: 70px; font-size: 0.75em; font-weight: bold; }
        .gauge-val {
            font-family: monospace; font-size: 1.1em; color: #51cf66;
            text-align: center; background: #111; padding: 4px; border-radius: 4px; border: 1px solid #333;
        }
        .hint { font-size: 0.75em; color: #aaa; margin-top: 4px; font-style: italic; }
        .pump-btn {
            background: #ff922b; color: #000; font-weight: bold; border: none;
            padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 4px;
        }
        .pump-btn:hover { background: #ffa8a8; }
    </style>
</head>
<body>

<h1>Mô Phỏng Khí Lý Tưởng (Ống Bơm & Điều Chỉnh Áp Suất)</h1>

<div class="sim-container">
    <canvas id="phetCanvas" width="480" height="460"></canvas>

    <div class="panel">
        <!-- 1. Đẳng quá trình -->
        <div class="box" style="border: 1px solid #4dabf7;">
            <div class="box-title">Khóa Đại Lượng (Đẳng Quá Trình)</div>
            <div class="radio-group">
                <label><input type="radio" name="keepConst" value="none" checked onchange="setProcess('none')"> Tự do (Kéo pít-tông tùy ý)</label>
                <label><input type="radio" name="keepConst" value="temp" onchange="setProcess('temp')"> 🔒 <b>Đẳng nhiệt</b> (T = const)</label>
                <label><input type="radio" name="keepConst" value="volume" onchange="setProcess('volume')"> 🔒 <b>Đẳng tích</b> (V = const)</label>
                <label><input type="radio" name="keepConst" value="pressure" onchange="setProcess('pressure')"> 🔒 <b>Đẳng áp</b> (P = const)</label>
            </div>
            <div class="hint" id="processHint">Kéo ống bơm để thêm hạt khí vào bình.</div>
        </div>

        <!-- 2. Bơm hạt & Thay đổi Áp suất -->
        <div class="box">
            <div class="box-title">Tác Động Áp Suất & Số Hạt</div>
            <div class="control-row">
                <label>Số lượng hạt (N): <b id="particleCountText" style="color: #51cf66;">50</b></label>
                <button class="pump-btn" onclick="pumpParticles(10)">💨 Nhấn Bơm +10 Hạt Khí</button>
            </div>
            <div class="control-row" style="margin-top: 8px;">
                <label>Điều chỉnh Áp suất P mong muốn (atm):</label>
                <input type="range" id="pressureSlider" class="h-slider" min="0.2" max="3.0" step="0.05" value="1.0" oninput="manualAdjustPressure(this.value)">
            </div>
        </div>

        <!-- 3. Nhiệt độ -->
        <div class="box">
            <div class="box-title">Truyền Nhiệt (Nóng / Lạnh)</div>
            <div class="heater-control">
                <div class="labels">
                    <span style="color: #ff6b6b;">🔥 NÓNG</span>
                    <span style="color: #888;">⚪ GIỮ</span>
                    <span style="color: #4dabf7;">❄️ LẠNH</span>
                </div>
                <div class="slider-axis">
                    <input type="range" id="tempLever" class="v-slider" min="-1" max="1" step="0.05" value="0" oninput="adjustTemp(this.value)" onmouseup="resetLever()" ontouchend="resetLever()">
                </div>
                <div style="font-size: 1.5em;" id="heatIcon">🛑</div>
            </div>
        </div>

        <!-- 4. Thông số -->
        <div class="box">
            <div class="box-title">Đồng Hồ Đo PhET</div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.85em;">
                <span>Nhiệt độ (T): <b id="tempReadout" style="color: #ffd43b;">300</b> K</span>
                <span>Thể tích (V): <b id="volReadout" style="color: #4dabf7;">1.00</b> L</span>
            </div>
            <div>Áp suất khí (P):</div>
            <div class="gauge-val"><span id="pressureReadout">1.00</span> atm</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('phetCanvas');
const ctx = canvas.getContext('2d');

let T = 300;
let targetPressure = 1.0;
let lockMode = 'none';

let particles = [];
let leverVal = 0;

// Bình chứa
const containerLeft = 100;
const containerWidth = 320;
const containerBottom = 420;
let pistonY = 180;
let isDraggingPiston = false;

// Cần bơm (Pump handle animation)
let pumpOffsetY = 0;

class IdealGasParticle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle);
        this.vy = Math.sin(angle);
        this.r = 3;
    }

    update(bounds, speedFactor) {
        this.x += this.vx * speedFactor;
        this.y += this.vy * speedFactor;

        if (this.x - this.r < bounds.left) { this.x = bounds.left + this.r; this.vx *= -1; }
        if (this.x + this.r > bounds.right) { this.x = bounds.right - this.r; this.vx *= -1; }
        if (this.y - this.r < bounds.top) { this.y = bounds.top + this.r; this.vy *= -1; }
        if (this.y + this.r > bounds.bottom) { this.y = bounds.bottom - this.r; this.vy *= -1; }
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = '#51cf66';
        ctx.fill();
    }
}

function pumpParticles(count) {
    pumpOffsetY = 25;
    setTimeout(() => pumpOffsetY = 0, 150);

    for (let i = 0; i < count; i++) {
        const x = containerLeft + 15 + Math.random() * (containerWidth - 30);
        const y = pistonY + 15 + Math.random() * (containerBottom - pistonY - 30);
        particles.push(new IdealGasParticle(x, y));
    }
    document.getElementById('particleCountText').textContent = particles.length;
}

function setProcess(mode) {
    lockMode = mode;
    const hint = document.getElementById('processHint');
    const tempLever = document.getElementById('tempLever');

    if (mode === 'temp') {
        hint.innerHTML = '🔒 <b>Đẳng nhiệt:</b> T cố định. Kéo Pít-tông hoặc thanh Áp suất để đổi V.';
        tempLever.disabled = true;
    } else if (mode === 'volume') {
        hint.innerHTML = '🔒 <b>Đẳng tích:</b> V cố định. Thay đổi T hoặc số hạt để đổi P.';
        tempLever.disabled = false;
    } else if (mode === 'pressure') {
        hint.innerHTML = '🔒 <b>Đẳng áp:</b> P cố định. Thể tích tự động đổi khi tăng/giảm Nhiệt độ T.';
        tempLever.disabled = false;
        const currentV = (containerBottom - pistonY) / 240;
        targetPressure = (particles.length * T) / (currentV * 12000);
        document.getElementById('pressureSlider').value = targetPressure.toFixed(2);
    } else {
        hint.innerHTML = 'Bơm thêm hạt khí hoặc kéo pít-tông tùy ý.';
        tempLever.disabled = false;
    }
}

function manualAdjustPressure(val) {
    targetPressure = parseFloat(val);
    const N = particles.length;
    if (N === 0) return;

    if (lockMode === 'volume') {
        const V = (containerBottom - pistonY) / 240;
        T = (targetPressure * V * 12000) / N;
        if (T < 10) T = 10;
    } else {
        const desiredV = (N * T) / (targetPressure * 12000);
        let desiredPistonY = containerBottom - (desiredV * 240);
        if (desiredPistonY < 80) desiredPistonY = 80;
        if (desiredPistonY > 340) desiredPistonY = 340;
        pistonY = desiredPistonY;
    }
}

canvas.addEventListener('mousedown', (e) => {
    if (lockMode === 'volume') return;
    const rect = canvas.getBoundingClientRect();
    const mouseY = e.clientY - rect.top;
    const mouseX = e.clientX - rect.left;

    if (mouseX >= containerLeft && mouseX <= containerLeft + containerWidth && Math.abs(mouseY - pistonY) < 25) {
        isDraggingPiston = true;
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (isDraggingPiston) {
        const rect = canvas.getBoundingClientRect();
        let mouseY = e.clientY - rect.top;
        if (mouseY < 80) mouseY = 80;
        if (mouseY > 340) mouseY = 340;
        pistonY = mouseY;
    }
});

window.addEventListener('mouseup', () => isDraggingPiston = false);

function adjustTemp(v) {
    if (lockMode === 'temp') return;
    leverVal = parseFloat(v);
    const icon = document.getElementById('heatIcon');
    if (leverVal > 0) icon.textContent = '🔥';
    else if (leverVal < 0) icon.textContent = '❄️';
    else icon.textContent = '🛑';
}

function resetLever() {
    leverVal = 0;
    document.getElementById('tempLever').value = 0;
    document.getElementById('heatIcon').textContent = '🛑';
}

function drawContainerAndPump() {
    ctx.strokeStyle = '#4dabf7';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(containerLeft, 60);
    ctx.lineTo(containerLeft, containerBottom);
    ctx.lineTo(containerLeft + containerWidth, containerBottom);
    ctx.lineTo(containerLeft + containerWidth, 60);
    ctx.stroke();

    ctx.fillStyle = (lockMode === 'volume') ? '#555' : (isDraggingPiston ? '#ff6b6b' : '#ffffd1');
    ctx.fillRect(containerLeft + 2, pistonY - 10, containerWidth - 4, 14);

    if (lockMode === 'volume') {
        ctx.fillStyle = '#ff4757';
        ctx.fillRect(containerLeft - 15, pistonY - 12, 12, 18);
        ctx.fillRect(containerLeft + containerWidth + 3, pistonY - 12, 12, 18);
    } else {
        ctx.fillStyle = '#888';
        ctx.fillRect(containerLeft + containerWidth / 2 - 8, pistonY - 50, 16, 40);
        ctx.beginPath();
        ctx.arc(containerLeft + containerWidth / 2, pistonY - 50, 14, 0, Math.PI * 2);
        ctx.fillStyle = isDraggingPiston ? '#ff6b6b' : '#4dabf7';
        ctx.fill();
    }

    const pumpX = 35;
    const pumpY = 280 + pumpOffsetY;
    
    ctx.fillStyle = '#ff922b';
    ctx.fillRect(pumpX - 12, pumpY, 24, 90);
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(pumpX, pumpY + 60);
    ctx.lineTo(containerLeft, containerBottom - 40);
    ctx.stroke();
    ctx.fillStyle = '#e03131';
    ctx.fillRect(pumpX - 25, pumpY - 15, 50, 15);
}

function drawHeatEffect() {
    if (leverVal > 0) {
        ctx.fillStyle = `rgba(255, 69, 0, ${leverVal * 0.7})`;
        ctx.beginPath();
        ctx.arc(containerLeft + containerWidth / 2, containerBottom + 20, 60 * leverVal, Math.PI, 0);
        ctx.fill();
    } else if (leverVal < 0) {
        ctx.fillStyle = `rgba(77, 171, 247, ${Math.abs(leverVal) * 0.7})`;
        ctx.fillRect(containerLeft, containerBottom - 5, containerWidth, 15);
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (leverVal !== 0 && lockMode !== 'temp') {
        T += leverVal * 3;
        if (T < 10) T = 10;
    }

    const N = particles.length;

    if (lockMode === 'pressure' && N > 0) {
        const desiredV = (N * T) / (targetPressure * 12000);
        let desiredPistonY = containerBottom - (desiredV * 240);
        if (desiredPistonY < 80) desiredPistonY = 80;
        if (desiredPistonY > 340) desiredPistonY = 340;
        pistonY += (desiredPistonY - pistonY) * 0.1;
    }

    const speedFactor = Math.sqrt(T) * 0.15;
    const bounds = { left: containerLeft + 4, right: containerLeft + containerWidth - 4, top: pistonY + 8, bottom: containerBottom - 4 };

    particles.forEach(p => {
        p.update(bounds, speedFactor);
        p.draw();
    });

    drawContainerAndPump();
    drawHeatEffect();

    const currentHeight = containerBottom - pistonY;
    const V = (currentHeight / 240);
    const P = N > 0 ? ((N * T) / (V * 12000)).toFixed(2) : "0.00";

    document.getElementById('tempReadout').textContent = Math.round(T);
    document.getElementById('volReadout').textContent = V.toFixed(2);
    document.getElementById('pressureReadout').textContent = lockMode === 'pressure' ? targetPressure.toFixed(2) : P;

    if (lockMode !== 'pressure') {
        document.getElementById('pressureSlider').value = P;
    }

    requestAnimationFrame(animate);
}

pumpParticles(50);
animate();
</script>

</body>
</html>
