<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trạng thái của vật chất</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="browser-bar">
      <div class="browser-dots">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <div class="tab active">Trạng thái của vật chất</div>
      <div class="address">phet.colorado.edu/.../states-of-matter</div>
    </header>

    <main class="simulation-area">
      <div class="center-panel">
        <div class="temp-box" id="tempBox">22 K</div>
        <div class="thermometer-shell">
          <div class="thermometer-scale"></div>
          <div class="thermometer-line">
            <div class="thermometer-fluid" id="thermoFluid"></div>
          </div>
          <div class="thermometer-bulb"></div>
        </div>
      </div>

      <div class="chamber-wrap">
        <div class="chamber-shadow"></div>
        <div class="chamber">
          <div class="chamber-top"></div>
          <div class="glass-inner">
            <canvas id="particleCanvas" width="360" height="420"></canvas>
          </div>
          <div class="glass-bottom"></div>
        </div>
      </div>

      <aside class="side-panel">
        <div class="panel-title">Nguyên tử và Phân tử</div>

        <div class="material-list">
          <button class="material-item active" data-material="neon">
            <span>Neon</span>
            <i class="dot neon"></i>
          </button>
          <button class="material-item" data-material="argon">
            <span>Argon</span>
            <i class="dot argon"></i>
          </button>
          <button class="material-item" data-material="oxygen">
            <span>Oxygen</span>
            <i class="dot oxygen"></i>
          </button>
          <button class="material-item" data-material="water">
            <span>Nước</span>
            <i class="dot water"></i>
          </button>
        </div>

        <div class="phase-list">
          <button class="phase active" data-phase="solid"><span class="icon">▣</span>Rắn</button>
          <button class="phase" data-phase="liquid"><span class="icon">◌</span>Lỏng</button>
          <button class="phase" data-phase="gas"><span class="icon">☁</span>Hơi</button>
        </div>
      </aside>

      <div class="control-row">
        <button class="control-button small" id="pauseBtn">❚❚</button>
        <button class="control-button small" id="playBtn">▶</button>
      </div>

      <div class="heat-pad" id="heatPad">
        <div class="heat-handle" id="heatHandle"></div>
      </div>

      <div class="pump-wrap">
        <div class="pump-body"></div>
        <div class="pump-handle" id="pumpHandle" aria-label="Nén/giãn khí"></div>
      </div>

      <div class="bottom-bar">
        <div class="title">Trạng thái của vật chất</div>
        <div class="nav">
          <div class="nav-item active"><span class="mini home"></span> Trạng thái</div>
          <div class="nav-item"><span class="mini cloud"></span> Chuyển phase</div>
          <div class="nav-item"><span class="mini dot"></span> Tương tác</div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
