<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trạng thái của vật chất</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app-shell"><header class="browser-bar"><div class="browser-dots"><i></i><i></i><i></i></div><div class="tab">Trạng thái của vật chất</div><div class="address">Mô phỏng vật lý tương tác</div></header>
<section class="simulation">
  <div class="temperature"><output id="temp">22 K</output><div class="thermo"><span id="thermoFill"></span><b></b></div></div>
  <section class="chamber-area"><div class="chamber" id="chamber"><div class="lid" id="lid">☝</div><div class="glass"><canvas id="particles" width="360" height="420"></canvas></div></div></section>
  <div class="bucket" id="bucket" title="Kéo xô lên để đun nóng, kéo xuống để làm lạnh"><div class="bucket-fire">🔥</div><div class="bucket-body">Xô nhiệt<div class="bucket-level" id="bucketLevel"></div></div></div>
  <aside class="right-panel"><h2>Nguyên tử và Phân tử</h2><div class="materials"><button class="material active" data-material="neon">Neon <i class="neon"></i></button><button class="material" data-material="argon">Argon <i class="argon"></i></button><button class="material" data-material="oxygen">Oxygen <i class="oxygen"></i></button><button class="material" data-material="water">Nước <i class="water"></i></button></div>
    <div id="statusPanel" class="tool-panel"><button class="phase active" data-phase="solid">▣ &nbsp; Rắn</button><button class="phase" data-phase="liquid">◉ &nbsp; Lỏng</button><button class="phase" data-phase="gas">☁ &nbsp; Hơi</button><p>Chạm và kéo <b>xô nhiệt</b> bên dưới bình.</p></div>
    <div id="phasePanel" class="tool-panel hidden"><div class="gauge"><b id="pressureText">Áp suất 1.0 atm</b><span id="gaugeNeedle"></span></div><p>Kéo tay bơm để đổi áp suất.</p><div class="pump" id="pump"><div class="pump-handle" id="pumpHandle"></div><div class="pump-body"></div></div><p>Kéo <b>ngón tay trên nắp</b> để đổi thể tích.</p></div>
    <div id="interactionPanel" class="tool-panel hidden"><p><b>Thế tương tác</b></p><div class="force-buttons"><button data-force="attract">Lực hút</button><button data-force="repel">Lực đẩy</button></div><canvas id="graph" width="230" height="145"></canvas><p>Khoảng cách: <b id="distanceText">2.0 σ</b><br>Lực: <b id="forceText">Hút</b></p></div>
  </aside>
  <div class="transport"><button id="pause">Ⅱ</button><button id="play">▶</button></div><button id="reset" class="reset">↻</button>
  <nav class="bottom"><strong>Trạng thái của vật chất</strong><div><button class="nav active" data-view="status">◈ Trạng thái</button><button class="nav" data-view="phase">♢ Chuyển phase</button><button class="nav" data-view="interaction">● Tương tác</button></div></nav>
</section></main><script src="app.js"></script></body></html>
