<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhET Simulation - Trạng Thái Vật Chất & Khí Lý Tưởng</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; }
        body {
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin: 0 0 15px 0; font-size: 1.6em; color: #4dabf7; text-shadow: 0 0 8px rgba(77,171,247,0.3); }
        .sim-container {
            display: flex;
            gap: 15px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        canvas {
            background: #000000;
            border-radius: 8px;
            cursor: pointer;
        }
        .panel {
            width: 280px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .box {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .box-title {
            font-weight: bold;
            font-size: 0.9em;
            color: #ffd43b;
            margin-bottom: 8px;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
            text-transform: uppercase;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        button {
            padding: 8px;
            border: none;
            border-radius: 4px;
            background: #3b3b3b;
            color: #fff;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { background: #4dabf7; color: #000; }
        button.active { background: #ff6b6b; color: #fff; font-weight: bold; }
        
        /* Cần gạt nhiệt độ phong cách PhET */
        .heater-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 6px;
        }
        .slider-axis {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 110px;
        }
        input[type="range"].v-slider {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            width: 16px;
            height: 90px;
            cursor: pointer;
        }
        .labels {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 90px;
            font-size: 0.8em;
            font-weight: bold;
        }
        .gauge-val {
            font-family: monospace;
            font-size: 1.2em;
            color: #51cf66;
            text-align: center;
            background: #111;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

<h1>Mô Phỏng Trạng Thái Vật Chất (PhET Style)</h1>

<div class="sim-container">
    <canvas id="phetCanvas" width="480" height="480"></canvas>

    <div class="panel">
        <!-- 1. Chọn Nguyên Tử / Phân Tử -->
        <div class="box">
            <div class="box-title">Phân Tử / Nguyên Tử</div>
            <div class="btn-grid">
                <button class="active" onclick="selectSubstance('neon')">Neon</button>
                <button onclick="selectSubstance('argon')">Argon</button>
                <button onclick="selectSubstance('oxygen')">Oxy (O₂)</button>
                <button onclick="selectSubstance('water')">Nước (H₂O)</button>
            </div>
        </div>

        <!-- 2. Chọn Trạng Thái -->
        <div class="box">
            <div class="box-title">Trạng Thái Khoản</div>
            <div class="btn-grid" style="grid-template-columns: 1fr 1fr 1fr;">
                <button id="btn-solid" onclick="setState('solid')">Rắn</button>
                <button id="btn-liquid" onclick="setState('liquid')">Lỏng</button>
                <button id="btn-gas" class="active" onclick="setState('gas')">Khí</button>
            </div>
        </div>

        <!-- 3. Điều Chỉnh Nhiệt Độ -->
        <div class="box">
            <div class="box-title">Nhiệt Độ (Lửa / Băng)</div>
            <div class="heater-control">
                <div class="labels">
                    <span style="color: #ff6b6b;">🔥 NÓNG</span>
                    <span style="color: #888;">⚪ GIỮ</span>
                    <span style="color: #4dabf7;">❄️ LẠNH</span>
                </div>
                <div class="slider-axis">
                    <input type="range" id="tempLever" class="v-slider" min="-1" max="1" step="0.05" value="0" oninput="adjustTemp(this.value)" onmouseup="resetLever()" ontouchend="resetLever()">
                </div>
                <div style="font-size: 1.5em;" id="heatIcon">🛑</div>
            </div>
        </div>

        <!-- 4. Hiển Thị Áp Suất & Nhiệt Độ -->
        <div class="box">
            <div class="box-title">Đồng Hồ Đo PhET</div>
            <div style="margin-bottom: 6px; font-size: 0.85em;">Nhiệt độ (T): <span id="tempReadout" style="color: #ffd43b;">300</span> K</div>
            <div>Áp suất (P):</div>
            <div class="gauge-val"><span id="pressureReadout">0.00</span> atm</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('phetCanvas');
const ctx = canvas.getContext('2d');

const substances = {
    neon:   { name: 'Neon', color1: '#ff4757', solidT: 14, liquidT: 26, gasT: 300, r: 7 },
    argon:  { name: 'Argon', color1: '#2ed573', solidT: 40, liquidT: 86, gasT: 300, r: 9 },
    oxygen: { name: 'Oxy', color1: '#1e90ff', isDiatomic: true, solidT: 30, liquidT: 75, gasT: 300, r: 6 },
    water:  { name: 'Nước', color1: '#ff4757', color2: '#ffffff', isWater: true, solidT: 150, liquidT: 298, gasT: 400, r: 6 }
};

let currentSubstance = 'neon';
let T = 300;
let particles = [];
let leverVal = 0;
const N = 64;

// Kích thước bình chứa & Pít-tông
const containerLeft = 60;
const containerWidth = 360;
const containerBottom = 420;
let pistonY = 120; // Có thể kéo pít-tông từ Y=60 đến Y=300
let isDraggingPiston = false;

class Molecule {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.angle = Math.random() * Math.PI * 2;
        this.vRot = (Math.random() - 0.5) * 0.05;
    }

    update(bounds, speedFactor) {
        this.x += this.vx * speedFactor;
        this.y += this.vy * speedFactor;
        this.angle += this.vRot * speedFactor;

        const r = substances[currentSubstance].r * 1.5;

        // Va chạm tường trái/phải
        if (this.x - r < bounds.left) { this.x = bounds.left + r; this.vx *= -1; }
        if (this.x + r > bounds.right) { this.x = bounds.right - r; this.vx *= -1; }

        // Va chạm pít-tông (đỉnh) & đáy bình
        if (this.y - r < bounds.top) { this.y = bounds.top + r; this.vy *= -1; }
        if (this.y + r > bounds.bottom) { this.y = bounds.bottom - r; this.vy *= -1; }
    }

    draw() {
        const sub = substances[currentSubstance];
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        if (sub.isDiatomic) {
            ctx.beginPath();
            ctx.arc(-sub.r, 0, sub.r, 0, Math.PI * 2);
            ctx.arc(sub.r, 0, sub.r, 0, Math.PI * 2);
            ctx.fillStyle = sub.color1;
            ctx.fill();
        } else if (sub.isWater) {
            // Oxi
            ctx.beginPath();
            ctx.arc(0, 0, sub.r * 1.1, 0, Math.PI * 2);
            ctx.fillStyle = sub.color1;
            ctx.fill();
            // 2 Hidro
            ctx.beginPath();
            ctx.arc(-sub.r * 0.9, -sub.r * 0.7, sub.r * 0.6, 0, Math.PI * 2);
            ctx.arc(sub.r * 0.9, -sub.r * 0.7, sub.r * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = sub.color2;
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(0, 0, sub.r, 0, Math.PI * 2);
            ctx.fillStyle = sub.color1;
            ctx.fill();
        }
        ctx.restore();
    }
}

function selectSubstance(sub) {
    currentSubstance = sub;
    document.querySelectorAll('.box:nth-child(1) button').forEach(b => {
        b.classList.toggle('active', b.textContent.toLowerCase().includes(sub) || (sub==='oxygen'&&b.textContent.includes('O₂')) || (sub==='water'&&b.textContent.includes('Nước')));
    });
    setState('gas');
}

function setState(state) {
    const sub = substances[currentSubstance];
    document.getElementById('btn-solid').classList.remove('active');
    document.getElementById('btn-liquid').classList.remove('active');
    document.getElementById('btn-gas').classList.remove('active');
    document.getElementById(`btn-${state}`).classList.add('active');

    if (state === 'solid') { T = sub.solidT; initSolid(); }
    else if (state === 'liquid') { T = sub.liquidT; initLiquid(); }
    else { T = sub.gasT; initGas(); }
}

function initSolid() {
    particles = [];
    const cols = 8;
    const spacing = 28;
    const startX = containerLeft + (containerWidth - (cols - 1) * spacing) / 2;
    const startY = containerBottom - 120;

    for (let i = 0; i < N; i++) {
        const row = Math.floor(i / cols);
        const col = i % cols;
        particles.push(new Molecule(startX + col * spacing, startY + row * spacing));
    }
}

function initLiquid() {
    particles = [];
    const minY = containerBottom - 150;
    for (let i = 0; i < N; i++) {
        const x = containerLeft + 20 + Math.random() * (containerWidth - 40);
        const y = minY + Math.random() * (containerBottom - minY - 20);
        particles.push(new Molecule(x, y));
    }
}

function initGas() {
    particles = [];
    for (let i = 0; i < N; i++) {
        const x = containerLeft + 20 + Math.random() * (containerWidth - 40);
        const y = pistonY + 20 + Math.random() * (containerBottom - pistonY - 40);
        particles.push(new Molecule(x, y));
    }
}

// Xử lý Sự kiện Kéo/Thả Pít-tông
canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mouseY = e.clientY - rect.top;
    const mouseX = e.clientX - rect.left;

    if (mouseX >= containerLeft && mouseX <= containerLeft + containerWidth && Math.abs(mouseY - pistonY) < 20) {
        isDraggingPiston = true;
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (isDraggingPiston) {
        const rect = canvas.getBoundingClientRect();
        let mouseY = e.clientY - rect.top;
        if (mouseY < 60) mouseY = 60;
        if (mouseY > 300) mouseY = 300;
        pistonY = mouseY;
    }
});

window.addEventListener('mouseup', () => isDraggingPiston = false);

function adjustTemp(v) {
    leverVal = parseFloat(v);
    const icon = document.getElementById('heatIcon');
    if (leverVal > 0) icon.textContent = '🔥';
    else if (leverVal < 0) icon.textContent = '❄️';
    else icon.textContent = '🛑';
}

function resetLever() {
    leverVal = 0;
    document.getElementById('tempLever').value = 0;
    document.getElementById('heatIcon').textContent = '🛑';
}

function drawContainer() {
    // 1. Thân bình (Xilanh PhET)
    ctx.strokeStyle = '#4dabf7';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(containerLeft, pistonY - 40);
    ctx.lineTo(containerLeft, containerBottom);
    ctx.lineTo(containerLeft + containerWidth, containerBottom);
    ctx.lineTo(containerLeft + containerWidth, pistonY - 40);
    ctx.stroke();

    // 2. Pít-tông (Có tay cầm để kéo)
    ctx.fillStyle = isDraggingPiston ? '#ff6b6b' : '#ffffd1';
    ctx.fillRect(containerLeft + 2, pistonY - 10, containerWidth - 4, 12);

    // Tay cầm pít-tông
    ctx.fillStyle = '#888';
    ctx.fillRect(containerLeft + containerWidth / 2 - 10, pistonY - 50, 20, 40);
    ctx.beginPath();
    ctx.arc(containerLeft + containerWidth / 2, pistonY - 50, 15, 0, Math.PI * 2);
    ctx.fillStyle = '#ff6b6b';
    ctx.fill();
}

function drawLửaLạnhEffect() {
    if (leverVal > 0) {
        // Vẽ hiệu ứng Lửa
        ctx.fillStyle = `rgba(255, 69, 0, ${leverVal * 0.7})`;
        ctx.beginPath();
        ctx.arc(containerLeft + containerWidth / 2, containerBottom + 20, 60 * leverVal, Math.PI, 0);
        ctx.fill();
    } else if (leverVal < 0) {
        // Vẽ hiệu ứng Băng
        ctx.fillStyle = `rgba(77, 171, 247, ${Math.abs(leverVal) * 0.7})`;
        ctx.fillRect(containerLeft, containerBottom - 5, containerWidth, 15);
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Biến đổi Nhiệt độ T
    if (leverVal !== 0) {
        T += leverVal * 3;
        if (T < 1) T = 1;
    }

    const speedFactor = Math.sqrt(T) * 0.12;
    const bounds = { left: containerLeft + 5, right: containerLeft + containerWidth - 5, top: pistonY + 10, bottom: containerBottom - 5 };

    // Cập nhật & Vẽ phân tử
    particles.forEach(p => {
        p.update(bounds, speedFactor);
        p.draw();
    });

    drawContainer();
    drawLửaLạnhEffect();

    // Tính Toán Áp Suất P = (N * T) / Volume
    const Volume = (containerBottom - pistonY) / 100; // Đơn vị thể tích quy đổi
    const P = ((N * T) / (Volume * 1500)).toFixed(2);

    // Cập nhật UI
    document.getElementById('tempReadout').textContent = Math.round(T);
    document.getElementById('pressureReadout').textContent = P;

    requestAnimationFrame(animate);
}

// Khởi chạy
setState('gas');
animate();
</script>

</body>
    </html>
