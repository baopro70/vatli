<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mô Phỏng Khí Lý Tưởng (Hỗ trợ Điện thoại)</title>
    <style>
        * { 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin: 0 0 10px 0; font-size: 1.2em; color: #4dabf7; text-align: center; }
        .sim-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #333;
            width: 100%;
            max-width: 480px;
        }
        canvas { 
            background: #000000; 
            border-radius: 8px; 
            width: 100%; 
            height: auto;
            touch-action: none; /* Tránh cuộn trang khi vuốt trên canvas */
        }
        .panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .box {
            background: #2a2a2a;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .box-title {
            font-weight: bold;
            font-size: 0.8em;
            color: #ffd43b;
            margin-bottom: 4px;
            border-bottom: 1px solid #444;
            padding-bottom: 2px;
            text-transform: uppercase;
        }
        .radio-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 0.8em; }
        .radio-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
        
        .control-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 0.8em;
        }
        input[type="range"].h-slider { width: 100%; cursor: pointer; height: 25px; }

        .heater-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a1a;
            padding: 6px 12px;
            border-radius: 6px;
        }
        .slider-axis { display: flex; flex-direction: column; align-items: center; height: 70px; }
        input[type="range"].v-slider {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            width: 24px; height: 60px; cursor: pointer;
        }
        .labels { display: flex; flex-direction: column; justify-content: space-between; height: 60px; font-size: 0.75em; font-weight: bold; }
        .gauge-val {
            font-family: monospace; font-size: 1.1em; color: #51cf66;
            text-align: center; background: #111; padding: 4px; border-radius: 4px; border: 1px solid #333;
        }
        .hint { font-size: 0.75em; color: #aaa; margin-top: 4px; font-style: italic; }
        .pump-btn {
            background: #ff922b; color: #000; font-weight: bold; border: none;
            padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 4px;
            font-size: 0.9em;
        }
        .pump-btn:active { background: #ffa8a8; }
    </style>
</head>
<body>

<h1>Mô Phỏng Khí Lý Tưởng</h1>

<div class="sim-container">
    <canvas id="phetCanvas" width="480" height="420"></canvas>

    <div class="panel">
        <div class="box" style="border: 1px solid #4dabf7;">
            <div class="box-title">Đẳng Quá Trình</div>
            <div class="radio-group">
                <label><input type="radio" name="keepConst" value="none" checked onchange="setProcess('none')"> Tự do</label>
                <label><input type="radio" name="keepConst" value="temp" onchange="setProcess('temp')"> 🔒 Đẳng nhiệt</label>
                <label><input type="radio" name="keepConst" value="volume" onchange="setProcess('volume')"> 🔒 Đẳng tích</label>
                <label><input type="radio" name="keepConst" value="pressure" onchange="setProcess('pressure')"> 🔒 Đẳng áp</label>
            </div>
            <div class="hint" id="processHint">Vuốt pít-tông trên màn hình để di chuyển.</div>
        </div>

        <div class="box">
            <div class="box-title">Tác Động Áp Suất & Số Hạt</div>
            <div class="control-row">
                <label>Số lượng hạt (N): <b id="particleCountText" style="color: #51cf66;">50</b></label>
                <button class="pump-btn" onclick="pumpParticles(10)">💨 Bơm +10 Hạt Khí</button>
            </div>
            <div class="control-row" style="margin-top: 6px;">
                <label>Chỉnh Áp suất P (atm):</label>
                <input type="range" id="pressureSlider" class="h-slider" min="0.2" max="3.0" step="0.05" value="1.0" oninput="manualAdjustPressure(this.value)">
            </div>
        </div>

        <div class="box">
            <div class="box-title">Truyền Nhiệt (Nóng / Lạnh)</div>
            <div class="heater-control">
                <div class="labels">
                    <span style="color: #ff6b6b;">🔥 NÓNG</span>
                    <span style="color: #888;">⚪ GIỮ</span>
                    <span style="color: #4dabf7;">❄️ LẠNH</span>
                </div>
                <div class="slider-axis">
                    <input type="range" id="tempLever" class="v-slider" min="-1" max="1" step="0.05" value="0" oninput="adjustTemp(this.value)" onmouseup="resetLever()" ontouchend="resetLever()">
                </div>
                <div style="font-size: 1.5em;" id="heatIcon">🛑</div>
            </div>
        </div>

        <div class="box">
            <div class="box-title">Đồng Hồ Đo PhET</div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.85em;">
                <span>Nhiệt độ (T): <b id="tempReadout" style="color: #ffd43b;">300</b> K</span>
                <span>Thể tích (V): <b id="volReadout" style="color: #4dabf7;">1.00</b> L</span>
            </div>
            <div>Áp suất khí (P):</div>
            <div class="gauge-val"><span id="pressureReadout">1.00</span> atm</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('phetCanvas');
const ctx = canvas.getContext('2d');

let T = 300;
let targetPressure = 1.0;
let lockMode = 'none';

let particles = [];
let leverVal = 0;

const containerLeft = 90;
const containerWidth = 310;
const containerBottom = 390;
let pistonY = 160;
let isDraggingPiston = false;

let pumpOffsetY = 0;

class IdealGasParticle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        this.vx = Math.cos(angle);
        this.vy = Math.sin(angle);
        this.r = 3;
    }

    update(bounds, speedFactor) {
        this.x += this.vx * speedFactor;
        this.y += this.vy * speedFactor;

        if (this.x - this.r < bounds.left) { this.x = bounds.left + this.r; this.vx *= -1; }
        if (this.x + this.r > bounds.right) { this.x = bounds.right - this.r; this.vx *= -1; }
        if (this.y - this.r < bounds.top) { this.y = bounds.top + this.r; this.vy *= -1; }
        if (this.y + this.r > bounds.bottom) { this.y = bounds.bottom - this.r; this.vy *= -1; }
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = '#51cf66';
        ctx.fill();
    }
}

function pumpParticles(count) {
    pumpOffsetY = 20;
    setTimeout(() => pumpOffsetY = 0, 150);

    for (let i = 0; i < count; i++) {
        const x = containerLeft + 15 + Math.random() * (containerWidth - 30);
        const y = pistonY + 15 + Math.random() * (containerBottom - pistonY - 30);
        particles.push(new IdealGasParticle(x, y));
    }
    document.getElementById('particleCountText').textContent = particles.length;
}

function setProcess(mode) {
    lockMode = mode;
    const hint = document.getElementById('processHint');
    const tempLever = document.getElementById('tempLever');

    if (mode === 'temp') {
        hint.innerHTML = '🔒 <b>Đẳng nhiệt:</b> T cố định. Vuốt pít-tông để thay đổi V.';
        tempLever.disabled = true;
    } else if (mode === 'volume') {
        hint.innerHTML = '🔒 <b>Đẳng tích:</b> V cố định. Thay đổi T hoặc số hạt.';
        tempLever.disabled = false;
    } else if (mode === 'pressure') {
        hint.innerHTML = '🔒 <b>Đẳng áp:</b> P cố định. V tự động đổi khi đổi T.';
        tempLever.disabled = false;
        const currentV = (containerBottom - pistonY) / 240;
        targetPressure = (particles.length * T) / (currentV * 12000);
        document.getElementById('pressureSlider').value = targetPressure.toFixed(2);
    } else {
        hint.innerHTML = 'Vuốt pít-tông trên màn hình để di chuyển.';
        tempLever.disabled = false;
    }
}

function manualAdjustPressure(val) {
    targetPressure = parseFloat(val);
    const N = particles.length;
    if (N === 0) return;

    if (lockMode === 'volume') {
        const V = (containerBottom - pistonY) / 240;
        T = (targetPressure * V * 12000) / N;
        if (T < 10) T = 10;
    } else {
        const desiredV = (N * T) / (targetPressure * 12000);
        let desiredPistonY = containerBottom - (desiredV * 240);
        if (desiredPistonY < 70) desiredPistonY = 70;
        if (desiredPistonY > 310) desiredPistonY = 310;
        pistonY = desiredPistonY;
    }
}

// Xử lý tọa độ chạm cảm ứng & chuột chuẩn xác trên di động
function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
    };
}

function handleStart(e) {
    if (lockMode === 'volume') return;
    const pos = getCanvasPos(e);
    if (pos.x >= containerLeft && pos.x <= containerLeft + containerWidth && Math.abs(pos.y - pistonY) < 35) {
        isDraggingPiston = true;
        if (e.cancelable) e.preventDefault();
    }
}

function handleMove(e) {
    if (isDraggingPiston) {
        const pos = getCanvasPos(e);
        let mouseY = pos.y;
        if (mouseY < 70) mouseY = 70;
        if (mouseY > 310) mouseY = 310;
        pistonY = mouseY;
        if (e.cancelable) e.preventDefault();
    }
}

function handleEnd() {
    isDraggingPiston = false;
}

// Gắn sự kiện cả Chuột lẫn Cảm ứng
canvas.addEventListener('mousedown', handleStart);
canvas.addEventListener('mousemove', handleMove);
window.addEventListener('mouseup', handleEnd);

canvas.addEventListener('touchstart', handleStart, { passive: false });
canvas.addEventListener('touchmove', handleMove, { passive: false });
window.addEventListener('touchend', handleEnd);

function adjustTemp(v) {
    if (lockMode === 'temp') return;
    leverVal = parseFloat(v);
    const icon = document.getElementById('heatIcon');
    if (leverVal > 0) icon.textContent = '🔥';
    else if (leverVal < 0) icon.textContent = '❄️';
    else icon.textContent = '🛑';
}

function resetLever() {
    leverVal = 0;
    document.getElementById('tempLever').value = 0;
    document.getElementById('heatIcon').textContent = '🛑';
}

function drawContainerAndPump() {
    ctx.strokeStyle = '#4dabf7';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(containerLeft, 50);
    ctx.lineTo(containerLeft, containerBottom);
    ctx.lineTo(containerLeft + containerWidth, containerBottom);
    ctx.lineTo(containerLeft + containerWidth, 50);
    ctx.stroke();

    ctx.fillStyle = (lockMode === 'volume') ? '#555' : (isDraggingPiston ? '#ff6b6b' : '#ffffd1');
    ctx.fillRect(containerLeft + 2, pistonY - 10, containerWidth - 4, 14);

    if (lockMode === 'volume') {
        ctx.fillStyle = '#ff4757';
        ctx.fillRect(containerLeft - 15, pistonY - 12, 12, 18);
        ctx.fillRect(containerLeft + containerWidth + 3, pistonY - 12, 12, 18);
    } else {
        ctx.fillStyle = '#888';
        ctx.fillRect(containerLeft + containerWidth / 2 - 8, pistonY - 45, 16, 35);
        ctx.beginPath();
        ctx.arc(containerLeft + containerWidth / 2, pistonY - 45, 16, 0, Math.PI * 2);
        ctx.fillStyle = isDraggingPiston ? '#ff6b6b' : '#4dabf7';
        ctx.fill();
    }

    const pumpX = 30;
    const pumpY = 250 + pumpOffsetY;
    
    ctx.fillStyle = '#ff922b';
    ctx.fillRect(pumpX - 10, pumpY, 20, 80);
    ctx.strokeStyle = '#aaa';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(pumpX, pumpY + 50);
    ctx.lineTo(containerLeft, containerBottom - 40);
    ctx.stroke();
    ctx.fillStyle = '#e03131';
    ctx.fillRect(pumpX - 20, pumpY - 12, 40, 12);
}

function drawHeatEffect() {
    if (leverVal > 0) {
        ctx.fillStyle = `rgba(255, 69, 0, ${leverVal * 0.7})`;
        ctx.beginPath();
        ctx.arc(containerLeft + containerWidth / 2, containerBottom + 20, 60 * leverVal, Math.PI, 0);
        ctx.fill();
    } else if (leverVal < 0) {
        ctx.fillStyle = `rgba(77, 171, 247, ${Math.abs(leverVal) * 0.7})`;
        ctx.fillRect(containerLeft, containerBottom - 5, containerWidth, 15);
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (leverVal !== 0 && lockMode !== 'temp') {
        T += leverVal * 3;
        if (T < 10) T = 10;
    }

    const N = particles.length;

    if (lockMode === 'pressure' && N > 0) {
        const desiredV = (N * T) / (targetPressure * 12000);
        let desiredPistonY = containerBottom - (desiredV * 240);
        if (desiredPistonY < 70) desiredPistonY = 70;
        if (desiredPistonY > 310) desiredPistonY = 310;
        pistonY += (desiredPistonY - pistonY) * 0.1;
    }

    const speedFactor = Math.sqrt(T) * 0.15;
    const bounds = { left: containerLeft + 4, right: containerLeft + containerWidth - 4, top: pistonY + 8, bottom: containerBottom - 4 };

    particles.forEach(p => {
        p.update(bounds, speedFactor);
        p.draw();
    });

    drawContainerAndPump();
    drawHeatEffect();

    const currentHeight = containerBottom - pistonY;
    const V = (currentHeight / 240);
    const P = N > 0 ? ((N * T) / (V * 12000)).toFixed(2) : "0.00";

    document.getElementById('tempReadout').textContent = Math.round(T);
    document.getElementById('volReadout').textContent = V.toFixed(2);
    document.getElementById('pressureReadout').textContent = lockMode === 'pressure' ? targetPressure.toFixed(2) : P;

    if (lockMode !== 'pressure') {
        document.getElementById('pressureSlider').value = P;
    }

    requestAnimationFrame(animate);
}

pumpParticles(50);
animate();
</script>

</body>
</html>
