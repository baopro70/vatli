<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng Quá Trình Nhiệt Động Lực Học (PhET Style)</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; user-select: none; }
        body {
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin: 0 0 15px 0; font-size: 1.5em; color: #4dabf7; text-align: center; }
        .sim-container {
            display: flex;
            gap: 15px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        canvas {
            background: #000000;
            border-radius: 8px;
        }
        .panel {
            width: 290px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .box {
            background: #2a2a2a;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .box-title {
            font-weight: bold;
            font-size: 0.85em;
            color: #ffd43b;
            margin-bottom: 6px;
            border-bottom: 1px solid #444;
            padding-bottom: 4px;
            text-transform: uppercase;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        button {
            padding: 6px 8px;
            border: none;
            border-radius: 4px;
            background: #3b3b3b;
            color: #fff;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { background: #4dabf7; color: #000; }
        button.active { background: #ff6b6b; color: #fff; font-weight: bold; }
        
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85em;
        }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        /* Cần gạt nhiệt độ */
        .heater-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a1a;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .slider-axis {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 90px;
        }
        input[type="range"].v-slider {
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            width: 14px;
            height: 80px;
            cursor: pointer;
        }
        .labels {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 80px;
            font-size: 0.75em;
            font-weight: bold;
        }
        .gauge-val {
            font-family: monospace;
            font-size: 1.1em;
            color: #51cf66;
            text-align: center;
            background: #111;
            padding: 4px;
            border-radius: 4px;
            border: 1px solid #333;
        }
        .hint {
            font-size: 0.75em;
            color: #aaa;
            margin-top: 4px;
            font-style: italic;
        }
    </style>
</head>
<body>

<h1>Mô Phỏng Các Quá Trình Nhiệt Động Lực Học</h1>

<div class="sim-container">
    <canvas id="phetCanvas" width="460" height="460"></canvas>

    <div class="panel">
        <!-- 1. Giữ Cố Định Đại Lượng (Đẳng quá trình) -->
        <div class="box" style="border: 1fr solid #4dabf7;">
            <div class="box-title">Khóa Đại Lượng (Đẳng Quá Trình)</div>
            <div class="radio-group">
                <label><input type="radio" name="keepConst" value="none" checked onchange="setProcess('none')"> Không khóa (Tự do)</label>
                <label><input type="radio" name="keepConst" value="volume" onchange="setProcess('volume')"> 🔒 <b>Đẳng Tích</b> (Thể tích V cố định)</label>
                <label><input type="radio" name="keepConst" value="pressure" onchange="setProcess('pressure')"> 🔒 <b>Đẳng Áp</b> (Áp suất P cố định)</label>
            </div>
            <div class="hint" id="processHint">Kéo pít-tông bằng chuột để thay đổi Thể tích V.</div>
        </div>

        <!-- 2. Chọn Chất -->
        <div class="box">
            <div class="box-title">Chất Khí</div>
            <div class="btn-grid">
                <button class="active" onclick="selectSubstance('neon')">Neon</button>
                <button onclick="selectSubstance('argon')">Argon</button>
                <button onclick="selectSubstance('oxygen')">Oxy (O₂)</button>
                <button onclick="selectSubstance('water')">Nước (H₂O)</button>
            </div>
        </div>

        <!-- 3. Điều Chỉnh Nhiệt Độ -->
        <div class="box">
            <div class="box-title">Làm Nóng / Làm Lạnh</div>
            <div class="heater-control">
                <div class="labels">
                    <span style="color: #ff6b6b;">🔥 NÓNG</span>
                    <span style="color: #888;">⚪ GIỮ</span>
                    <span style="color: #4dabf7;">❄️ LẠNH</span>
                </div>
                <div class="slider-axis">
                    <input type="range" id="tempLever" class="v-slider" min="-1" max="1" step="0.05" value="0" oninput="adjustTemp(this.value)" onmouseup="resetLever()" ontouchend="resetLever()">
                </div>
                <div style="font-size: 1.5em;" id="heatIcon">🛑</div>
            </div>
        </div>

        <!-- 4. Hiển Thị Thông Số -->
        <div class="box">
            <div class="box-title">Đồng Hồ Đo PhET</div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.85em;">
                <span>Nhiệt độ (T): <b id="tempReadout" style="color: #ffd43b;">300</b> K</span>
                <span>Thể tích (V): <b id="volReadout" style="color: #4dabf7;">1.00</b> L</span>
            </div>
            <div>Áp suất (P):</div>
            <div class="gauge-val"><span id="pressureReadout">1.00</span> atm</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('phetCanvas');
const ctx = canvas.getContext('2d');

const substances = {
    neon:   { name: 'Neon', color1: '#ff4757', r: 7 },
    argon:  { name: 'Argon', color1: '#2ed573', r: 9 },
    oxygen: { name: 'Oxy', color1: '#1e90ff', isDiatomic: true, r: 6 },
    water:  { name: 'Nước', color1: '#ff4757', color2: '#ffffff', isWater: true, r: 6 }
};

let currentSubstance = 'neon';
let T = 300;
let targetPressure = 1.0;
let lockMode = 'none'; // 'none', 'volume', 'pressure'

const N = 60;
let particles = [];
let leverVal = 0;

// Bình chứa
const containerLeft = 60;
const containerWidth = 340;
const containerBottom = 420;
let pistonY = 180; // Vị trí Pít-tông ban đầu (Min Y: 80, Max Y: 340)
let isDraggingPiston = false;

class Molecule {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.angle = Math.random() * Math.PI * 2;
        this.vRot = (Math.random() - 0.5) * 0.05;
    }

    update(bounds, speedFactor) {
        this.x += this.vx * speedFactor;
        this.y += this.vy * speedFactor;
        this.angle += this.vRot * speedFactor;

        const r = substances[currentSubstance].r * 1.5;

        // Va chạm tường trái/phải
        if (this.x - r < bounds.left) { this.x = bounds.left + r; this.vx *= -1; }
        if (this.x + r > bounds.right) { this.x = bounds.right - r; this.vx *= -1; }

        // Va chạm pít-tông và đáy bình
        if (this.y - r < bounds.top) { this.y = bounds.top + r; this.vy *= -1; }
        if (this.y + r > bounds.bottom) { this.y = bounds.bottom - r; this.vy *= -1; }
    }

    draw() {
        const sub = substances[currentSubstance];
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        if (sub.isDiatomic) {
            ctx.beginPath();
            ctx.arc(-sub.r, 0, sub.r, 0, Math.PI * 2);
            ctx.arc(sub.r, 0, sub.r, 0, Math.PI * 2);
            ctx.fillStyle = sub.color1;
            ctx.fill();
        } else if (sub.isWater) {
            ctx.beginPath();
            ctx.arc(0, 0, sub.r * 1.1, 0, Math.PI * 2);
            ctx.fillStyle = sub.color1;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(-sub.r * 0.9, -sub.r * 0.7, sub.r * 0.6, 0, Math.PI * 2);
            ctx.arc(sub.r * 0.9, -sub.r * 0.7, sub.r * 0.6, 0, Math.PI * 2);
            ctx.fillStyle = sub.color2;
            ctx.fill();
        } else {
            ctx.beginPath();
            ctx.arc(0, 0, sub.r, 0, Math.PI * 2);
            ctx.fillStyle = sub.color1;
            ctx.fill();
        }
        ctx.restore();
    }
}

function initGas() {
    particles = [];
    for (let i = 0; i < N; i++) {
        const x = containerLeft + 20 + Math.random() * (containerWidth - 40);
        const y = pistonY + 20 + Math.random() * (containerBottom - pistonY - 40);
        particles.push(new Molecule(x, y));
    }
}

function selectSubstance(sub) {
    currentSubstance = sub;
    document.querySelectorAll('.box:nth-child(2) button').forEach(b => {
        b.classList.toggle('active', b.textContent.toLowerCase().includes(sub) || (sub==='oxygen'&&b.textContent.includes('O₂')) || (sub==='water'&&b.textContent.includes('Nước')));
    });
}

function setProcess(mode) {
    lockMode = mode;
    const hint = document.getElementById('processHint');

    if (mode === 'volume') {
        hint.innerHTML = '🔒 <b>Đẳng tích:</b> Pít-tông bị khóa chặt. Nhiệt độ tăng làm Áp suất tăng.';
    } else if (mode === 'pressure') {
        hint.innerHTML = '🔒 <b>Đẳng áp:</b> Áp suất P được giữ nguyên. Pít-tông tự nâng/hạ khi thay đổi Nhiệt độ.';
        // Lưu giá trị Áp suất hiện tại làm chuẩn
        const currentV = (containerBottom - pistonY) / 240;
        targetPressure = (N * T) / (currentV * 7200);
    } else {
        hint.innerHTML = 'Kéo pít-tông bằng chuột để thay đổi Thể tích V.';
    }
}

// Bắt sự kiện kéo Pít-tông bằng chuột
canvas.addEventListener('mousedown', (e) => {
    if (lockMode === 'volume') return; // Không cho kéo nếu đang Đẳng tích

    const rect = canvas.getBoundingClientRect();
    const mouseY = e.clientY - rect.top;
    const mouseX = e.clientX - rect.left;

    if (mouseX >= containerLeft && mouseX <= containerLeft + containerWidth && Math.abs(mouseY - pistonY) < 25) {
        isDraggingPiston = true;
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (isDraggingPiston) {
        const rect = canvas.getBoundingClientRect();
        let mouseY = e.clientY - rect.top;
        if (mouseY < 80) mouseY = 80;
        if (mouseY > 320) mouseY = 320;
        pistonY = mouseY;
    }
});

window.addEventListener('mouseup', () => isDraggingPiston = false);

function adjustTemp(v) {
    leverVal = parseFloat(v);
    const icon = document.getElementById('heatIcon');
    if (leverVal > 0) icon.textContent = '🔥';
    else if (leverVal < 0) icon.textContent = '❄️';
    else icon.textContent = '🛑';
}

function resetLever() {
    leverVal = 0;
    document.getElementById('tempLever').value = 0;
    document.getElementById('heatIcon').textContent = '🛑';
}

function drawContainer() {
    // 1. Bình xilanh
    ctx.strokeStyle = '#4dabf7';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(containerLeft, 60);
    ctx.lineTo(containerLeft, containerBottom);
    ctx.lineTo(containerLeft + containerWidth, containerBottom);
    ctx.lineTo(containerLeft + containerWidth, 60);
    ctx.stroke();

    // 2. Pít-tông
    ctx.fillStyle = (lockMode === 'volume') ? '#555' : (isDraggingPiston ? '#ff6b6b' : '#ffffd1');
    ctx.fillRect(containerLeft + 2, pistonY - 10, containerWidth - 4, 14);

    // Khóa đẳng tích (vẽ chốt khóa)
    if (lockMode === 'volume') {
        ctx.fillStyle = '#ff4757';
        ctx.fillRect(containerLeft - 15, pistonY - 12, 12, 18);
        ctx.fillRect(containerLeft + containerWidth + 3, pistonY - 12, 12, 18);
    } else {
        // Tay cầm pít-tông
        ctx.fillStyle = '#888';
        ctx.fillRect(containerLeft + containerWidth / 2 - 8, pistonY - 50, 16, 40);
        ctx.beginPath();
        ctx.arc(containerLeft + containerWidth / 2, pistonY - 50, 14, 0, Math.PI * 2);
        ctx.fillStyle = isDraggingPiston ? '#ff6b6b' : '#4dabf7';
        ctx.fill();
    }
}

function drawHeatEffect() {
    if (leverVal > 0) {
        ctx.fillStyle = `rgba(255, 69, 0, ${leverVal * 0.7})`;
        ctx.beginPath();
        ctx.arc(containerLeft + containerWidth / 2, containerBottom + 20, 60 * leverVal, Math.PI, 0);
        ctx.fill();
    } else if (leverVal < 0) {
        ctx.fillStyle = `rgba(77, 171, 247, ${Math.abs(leverVal) * 0.7})`;
        ctx.fillRect(containerLeft, containerBottom - 5, containerWidth, 15);
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Cập nhật Nhiệt độ T
    if (leverVal !== 0) {
        T += leverVal * 3;
        if (T < 5) T = 5;
    }

    // Xử lý Quá trình ĐẲNG ÁP (Tự điều chỉnh Thể tích/Pít-tông)
    if (lockMode === 'pressure') {
        // V tỉ lệ thuận với T -> Pít-tông dịch chuyển theo T
        // V = (N * T) / (P * const)
        const desiredHeight = (N * T) / (targetPressure * 7200);
        let desiredPistonY = containerBottom - (desiredHeight * 240);

        if (desiredPistonY < 80) desiredPistonY = 80;
        if (desiredPistonY > 320) desiredPistonY = 320;

        // Trôi mượt tới vị trí mới
        pistonY += (desiredPistonY - pistonY) * 0.1;
    }

    const speedFactor = Math.sqrt(T) * 0.12;
    const bounds = { left: containerLeft + 5, right: containerLeft + containerWidth - 5, top: pistonY + 10, bottom: containerBottom - 5 };

    // Cập nhật & Vẽ phân tử
    particles.forEach(p => {
        p.update(bounds, speedFactor);
        p.draw();
    });

    drawContainer();
    drawHeatEffect();

    // Tính Thể tích V và Áp suất P
    const currentHeight = containerBottom - pistonY;
    const V = (currentHeight / 240); // Chuẩn hóa V từ ~0.4 đến ~1.4 Lít
    const P = ((N * T) / (V * 7200)).toFixed(2);

    // Cập nhật UI
    document.getElementById('tempReadout').textContent = Math.round(T);
    document.getElementById('volReadout').textContent = V.toFixed(2);
    document.getElementById('pressureReadout').textContent = lockMode === 'pressure' ? targetPressure.toFixed(2) : P;

    requestAnimationFrame(animate);
}

// Khởi tạo
initGas();
animate();
</script>

</body>
    </html>
